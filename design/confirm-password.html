<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm password · TDFC Companion App</title>
<style data-od-inline-asset="tdfc.css">/* TDFC Companion App — shared mockup stylesheet.
   Tokens mirror resources/css/app.css (shadcn neutrals, 0.625rem radius) plus the
   brand trio used on welcome.tsx: coral #F57979, sun #FFE57E, blue #3B82F6. */
:root{
  --bg:oklch(1 0 0); --fg:oklch(.145 0 0); --card:oklch(1 0 0);
  --muted:oklch(.97 0 0); --muted-fg:oklch(.5 0 0);
  --border:oklch(.922 0 0); --input:oklch(.922 0 0); --ring:oklch(.708 0 0);
  --primary:oklch(.205 0 0); --primary-fg:oklch(.985 0 0);
  --destructive:oklch(.577 .245 27.3);
  --sidebar:oklch(.985 0 0);
  --page:oklch(.975 0 0);
  /* brand */
  --coral:#F57979; --coral-ink:oklch(.5 .17 24); --coral-soft:color-mix(in oklch,var(--coral) 16%,white);
  --sun:#FFE57E;   --sun-ink:oklch(.45 .09 85);  --sun-soft:color-mix(in oklch,var(--sun) 35%,white);
  --blue:#3B82F6;  --blue-ink:oklch(.48 .19 262); --blue-soft:color-mix(in oklch,var(--blue) 12%,white);
  --ok:oklch(.55 .14 155); --ok-soft:oklch(.96 .04 155);
  --radius:10px; --radius-lg:20px;
  --font:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgb(0 0 0/.06),0 1px 3px rgb(0 0 0/.06);
  --shadow-lg:0 10px 30px rgb(0 0 0/.12);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.5;color:var(--fg);background:var(--page);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0;text-wrap:pretty}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted-fg)} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.primary:hover{background:oklch(.32 0 0)}
.btn.coral{background:var(--coral);color:oklch(.2 .05 24);border-color:var(--coral);font-weight:700}
.btn.coral:hover{background:color-mix(in oklch,var(--coral) 88%,black)}
.btn.danger{background:var(--destructive);color:#fff;border-color:var(--destructive)}
.btn.danger:hover{background:color-mix(in oklch,var(--destructive) 88%,black)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--muted)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* forms */
.field{display:grid;gap:6px}.field label{font-weight:500;font-size:14px}
.input,.select,.textarea{height:40px;width:100%;padding:0 12px;border:1px solid var(--input);border-radius:var(--radius);background:var(--bg);box-shadow:var(--shadow)}
.textarea{height:auto;padding:10px 12px;min-height:88px}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px oklch(.87 0 0/.6)}
.input.err{border-color:var(--destructive)} .err-msg{color:var(--destructive);font-size:13px}
.hint{color:var(--muted-fg);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}

/* cards, badges, tables */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.card-h{padding:18px 20px 0}.card-b{padding:20px}.card-h h3{font-size:16px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--muted);color:var(--fg)}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--sun-soft);color:var(--sun-ink)}
.badge.bad{background:var(--coral-soft);color:var(--coral-ink)} .badge.info{background:var(--blue-soft);color:var(--blue-ink)}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted-fg);padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--border)}.tbl tr:last-child td{border-bottom:0}.tbl tbody tr:hover{background:var(--muted)}
.tbl .r{text-align:right}.tbl-wrap{overflow-x:auto}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.progress{height:8px;border-radius:99px;background:var(--muted);overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* modal */
.modal-back{position:fixed;inset:0;background:oklch(0 0 0/.5);display:none;place-items:center;padding:16px;z-index:50}
.modal-back.open{display:grid}
.modal{background:var(--bg);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:480px;padding:24px;max-height:90vh;overflow:auto}
.modal h3{font-size:18px;font-weight:600}.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* auth shell */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--page)}
.auth-card{width:100%;max-width:420px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden}
.auth-card .strip{height:12px;background:linear-gradient(90deg,var(--coral),var(--sun),var(--blue))}
.auth-card .body{padding:32px;display:grid;gap:20px}
.auth-card .logo{margin:0 auto;width:140px}
.auth-card h1{font-size:22px;font-weight:600;text-align:center}.auth-card .sub{text-align:center;color:var(--muted-fg)}
.link{color:var(--blue-ink);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* app shell: inset sidebar */
.shell{display:flex;min-height:100vh;background:var(--sidebar)}
.side{width:256px;flex:none;padding:8px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:8px;padding:8px;font-weight:600}
.side .brand .mk{width:32px;height:32px;border-radius:8px;background:var(--primary);display:grid;place-items:center}
.side .brand .mk img{width:24px;height:24px;object-fit:contain}
.side .grp{font-size:12px;color:var(--muted-fg);padding:16px 8px 6px}
.side nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-weight:500}
.side nav a:hover{background:var(--muted)} .side nav a.on{background:var(--muted);font-weight:600}
.side .foot{margin-top:auto;display:grid;gap:2px}
.side .user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px}.side .user:hover{background:var(--muted)}
.side .user small{display:block;color:var(--muted-fg);font-size:12px}
.main{flex:1;min-width:0;margin:8px 8px 8px 0;background:var(--page);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg);border-radius:14px 14px 0 0;color:var(--muted-fg)}
.topbar b{color:var(--fg);font-weight:600}
.content{padding:24px;display:grid;gap:20px;align-content:start}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-h h1{font-size:24px;font-weight:600}.page-h p{color:var(--muted-fg)}
.stat{padding:18px 20px}.stat small{color:var(--muted-fg);font-size:13px}.stat b{display:block;font-size:26px;font-weight:600;margin-top:4px}
.mnav{display:none}
@media(max-width:860px){
  .side{display:none}.main{margin:0;border-radius:0;border:0}.topbar{border-radius:0}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--bg);border-top:1px solid var(--border);z-index:20}
  .mnav a{flex:1;display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;color:var(--muted-fg)}.mnav a.on{color:var(--fg);font-weight:600}
  .content{padding:16px 16px 88px}
}
</style>
<style>.wrap{width:100%;max-width:384px;display:grid;gap:32px}.hd{display:grid;gap:16px;justify-items:center;text-align:center}.hd h1{font-size:20px;font-weight:500}.hd p{color:var(--muted-fg);font-size:14px}.input{height:44px}</style></head>
